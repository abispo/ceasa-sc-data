[project]
name = "ceasa-sc-data"
version = "0.1.0"
description = "Pipeline de engenharia de dados e dashboards de cotações de preços da CEASA/SC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
]

[project.scripts]
ceasa-sc-data = "ceasa_sc_data.main:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
